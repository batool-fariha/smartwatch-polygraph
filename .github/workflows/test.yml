name: test

on:
  push:
  pull_request:

jobs:
  unit:
    name: engine and rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine test and unit tests for every rule
        run: node --test test/

  browser:
    name: browser (uploads, bad files, accessibility, stress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install test dependencies
        run: npm ci
        working-directory: e2e
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
        working-directory: e2e
      - name: Browser tests, including the stress run
        run: node e2e.js --stress
        working-directory: e2e
